<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Canvas</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="branding">
        <div class="brand-icon">✨</div>
        <div class="brand-text">
          <div class="brand-name">AI Canvas</div>
          <div class="brand-hint">上传图片，拖拽与编辑</div>
        </div>
      </div>
      <div class="actions">
        <button id="undoBtn" class="ghost">撤销</button>
        <button id="redoBtn" class="ghost">重做</button>
        <label class="primary">
          <input id="fileInput" type="file" accept="image/*" multiple hidden />
          <span>上传图片</span>
        </label>
        <button id="splitBtn" class="secondary">AI 拆分</button>
      </div>
    </header>

    <main class="layout">
      <section class="canvas-wrapper">
        <div id="canvas" class="canvas"></div>
        <div id="scaleIndicator" class="scale-indicator">Scale: 100%</div>
        <div id="floatingToolbar" class="floating-toolbar hidden"></div>
      </section>
      <aside class="chat" id="chatSidebar">
        <div class="chat-header">
          <div class="chat-title">AI 助手</div>
          <button id="closeChat" class="ghost">×</button>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input">
          <textarea id="chatInput" rows="2" placeholder="输入消息…"></textarea>
          <div class="chat-actions">
            <label class="ghost small">
              <input id="chatImage" type="file" accept="image/*" hidden />图片
            </label>
            <button id="sendChat" class="primary small">发送</button>
          </div>
        </div>
      </aside>
    </main>

    <script src="js/app.js" type="module"></script>
  </body>
</html>
